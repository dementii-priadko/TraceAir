services:
  backend:
    profiles: ["dev", "prod"]
    build:
      context: ./Backend
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    profiles: ["prod"]
    build:
      context: ./Frontend/uav-dashboard
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEFAULT_FLIGHT_ID: ${VITE_DEFAULT_FLIGHT_ID:-a2ed9650-0638-4597-8374-995d8e6660a4}
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./Frontend/uav-dashboard
      target: development
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEFAULT_FLIGHT_ID: ${VITE_DEFAULT_FLIGHT_ID:-a2ed9650-0638-4597-8374-995d8e6660a4}
      VITE_DEV_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./Frontend/uav-dashboard:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

  caddy:
    profiles: ["prod"]
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-traceair.snufkink.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  frontend-node-modules:
  caddy-data:
  caddy-config:
